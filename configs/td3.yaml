algo: td3
seed: 0
env: !include env.yaml
agent:
  hidden: [256, 256]
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  exploration_noise: 0.1
  smooth_temporal: 0.5    # CAPS temporal smoothness, relative to |Q|
  smooth_spatial: 0.5     # CAPS spatial smoothness under sensor-scale noise
train:
  episodes: 800
  warmup_steps: 10000
  warmup_policy: fallback   # seed the replay buffer with noisy safe-controller demos
  warmup_noise: 0.3
  checkpoint_every: 100
  threads: 2
  batch_size: 256
  log_every: 10
