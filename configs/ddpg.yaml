algo: ddpg
seed: 0
env: !include env.yaml
agent:
  hidden: [256, 256]
  actor_lr: 1.0e-4
  critic_lr: 1.0e-3
  gamma: 0.99
  tau: 0.005
  exploration_noise: 0.1
train:
  episodes: 800
  warmup_steps: 10000
  warmup_policy: fallback   # seed the replay buffer with noisy safe-controller demos
  warmup_noise: 0.3
  checkpoint_every: 100
  threads: 2
  batch_size: 256
  log_every: 10
